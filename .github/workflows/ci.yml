name: Tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - shell: bash
        run: |
          cp -R "$GITHUB_WORKSPACE" "$RUNNER_TEMP/autohours-source"
          python -m pip install "$RUNNER_TEMP/autohours-source[dev]" tzdata
      - run: python -B -m pytest -p no:cacheprovider
      - run: autohours --help
