name: Draft desktop release
on:
  push:
    tags: ['v*']
  # Manual runs build and smoke test without creating a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: autohours-windows.exe
          - os: macos-latest
            asset: autohours-macos-apple-silicon.zip
          - os: macos-15-intel
            asset: autohours-macos-intel.zip
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install from a temp copy so setuptools metadata also stays outside the checkout.
      - name: Prepare build source
        shell: bash
        run: |
          cp -R "$GITHUB_WORKSPACE" "$RUNNER_TEMP/autohours-source"
          python -m pip install "$RUNNER_TEMP/autohours-source[dev,build]"
      - name: Test offline fixtures
        run: python -B -m pytest -p no:cacheprovider
      - name: Build app
        shell: bash
        env:
          PYINSTALLER_CONFIG_DIR: ${{ runner.temp }}/pyinstaller-cache
        run: python -B -m PyInstaller --noconfirm --clean --workpath "$RUNNER_TEMP/autohours-work" --distpath "$RUNNER_TEMP/autohours-dist" packaging/autohours.spec
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: bash
        run: cp "$RUNNER_TEMP/autohours-dist/autohours.exe" "$RUNNER_TEMP/${{ matrix.asset }}"
      - name: Smoke test the macOS application
        if: runner.os == 'macOS'
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python -B packaging/smoke.py "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/autohours-dist/autohours.app/Contents/MacOS/autohours"
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/autohours-dist/autohours.app" "$RUNNER_TEMP/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'macOS'
        with:
          name: smoke-screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "autohours $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/release/autohours-* --clobber
