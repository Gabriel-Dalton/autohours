<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>autohours</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/" id="brand" aria-label="autohours home">
      <svg class="icon icon-20" aria-hidden="true" focusable="false"><use href="/icons.svg#time"></use></svg>
      <span>autohours</span>
    </a>
    <button id="quit" class="header-action" type="button" aria-label="Close app">Close app<svg class="icon icon-20" aria-hidden="true" focusable="false"><use href="/icons.svg#power"></use></svg></button>
  </header>
  <nav id="setup-progress" class="setup-progress" aria-label="Setup progress" hidden>
    <p id="progress-label" aria-live="polite"></p>
    <ol id="progress"></ol>
  </nav>
  <main id="content" tabindex="-1">
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <div id="page"><h1>Opening your timesheets...</h1><div class="skeleton" aria-label="Loading"></div></div>
    <footer id="footer"></footer>
  </main>
  <div class="privacy-container"><p class="privacy-footer"><svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#information--filled"></use></svg>Private by design. Your activity stays on this computer.</p></div>
  <noscript>Enable JavaScript in this local window to use autohours.</noscript>
</body>
</html>
