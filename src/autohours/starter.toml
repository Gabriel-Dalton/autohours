# Copy this file to autohours.toml, or run autohours init.
# Set your IANA timezone. Windows may need: pip install tzdata.
timezone = "America/Vancouver"

[activitywatch]
# ActivityWatch must run locally. /api/0 is added automatically if omitted.
url = "http://localhost:5600"
# Leave hostname unset for one computer. With several hosts, choose exactly one.
# hostname = "my-laptop"
# Optional browser extension data. Only foreground-title matches supply URLs.
use_web = false

[blocks]
# Group nearby slices into one entry. Excluded gaps are never billed.
# Bridge interruptions by other projects, unmatched windows and away time.
merge_gap_minutes = 5
# Discard blocks shorter than this many minutes after rounding.
min_block_minutes = 10
# 0 disables rounding. Otherwise round billed duration per entry.
round_to_minutes = 0

# Defaults for all projects. A project's agreement overrides these fields.
[policy]
count_breaks_up_to_minutes = 0
count_calls_when_away = false
call_apps = ['Zoom', 'Google Meet', 'Microsoft Teams', 'Slack huddle', 'Discord']
call_titles = ['Google Meet', 'Microsoft Teams', 'Slack huddle']
rounding = "nearest" # nearest (half up) or up
# round_to_minutes = 5 # overrides blocks.round_to_minutes
# billing = "hourly" # hourly, flat, retainer or none
# No rate, currency or cap is assumed. Set only values you have agreed.
# rate = 120
# currency = "CAD"
# monthly_cap_hours = 40

[destination]
# Start with a local CSV. Relative paths are relative to this config's folder.
type = "csv"
path = "timesheet.csv"
# For Clockify, replace the two lines above with:
# type = "clockify"
# workspace = "My workspace"
# workspace accepts an exact name or ID. Create projects in Clockify first.
# Set CLOCKIFY_API_KEY in your environment, NEVER in this file.

# Put specific projects above general ones. The first matching project wins.
# Any regex in title, app OR url is enough. All matches ignore letter case.
# Single-quoted TOML strings preserve regex backslashes without extra escaping.
[[projects]]
name = "Acme Corp"
# Destination name defaults to name; exact project names or IDs work in Clockify.
destination_project = "Acme Corp"
# Only this fixed description is exported, never window titles or URLs.
description = "Project work"
billable = true
title = ['Acme', 'acme-workspace']
app = []
url = ['^https://acme\.example/']

# Optional agreement for this project. Rates are examples, not defaults.
[projects.agreement]
billing = "hourly"
# rate = 120
# currency = "CAD"
# count_breaks_up_to_minutes = 5
# count_calls_when_away = true
# round_to_minutes = 5
# rounding = "up"
# monthly_cap_hours = 40

[[projects]]
name = "Side project"
description = "Development"
billable = false
title = ['side-project']

[[projects]]
name = "Learning"
description = "Study"
billable = false
title = ['tutorial', 'course notes']
# App-only rules are broad. Add them only when every use belongs to this project.
# app = ['^StudyApp$']
