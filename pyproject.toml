[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autohours"
version = "0.3.0"
description = "Turn local computer activity into reviewable timesheet entries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
autohours = "autohours.cli:main"

[tool.setuptools.package-data]
autohours = ["starter.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
